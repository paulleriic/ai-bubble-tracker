name: Mise à jour quotidienne des cours
on:
  schedule:
    - cron: "30 22 * * 1-5"   # après la clôture de Wall Street
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python scripts/fetch_prices.py
      - run: python scripts/compute.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Cours du $(date -u +%F)"
          git push
